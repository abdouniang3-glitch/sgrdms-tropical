{% extends "base.html" %}
{% block title %}Ajouter Médecin{% endblock %}
{% block page_icon %}<i class="fas fa-user-md"></i>{% endblock %}
{% block page_title %}Ajouter un Médecin{% endblock %}
{% block content %}<div style="max-width:640px">
<form method="POST" class="fade-in">
  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><span><i class="fas fa-id-badge"></i> Profil médecin</span></div>
    <div class="card-body">
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">Nom *</label><input type="text" name="nom" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Prénom *</label><input type="text" name="prenom" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Spécialité</label><input type="text" name="specialite" class="form-control"></div>
        <div class="form-group"><label class="form-label">Téléphone</label><input type="text" name="telephone" class="form-control"></div>
        <div class="form-group" style="grid-column:span 2"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
        <div class="form-group" style="grid-column:span 2"><label class="form-label">Disponibilités</label><input type="text" name="disponibilite" class="form-control" placeholder="ex: Lun-Ven 08h-17h"></div>
      </div>
      <div class="form-check"><input type="checkbox" name="actif_teleconsult" id="tc"><label for="tc">Activer la téléconsultation</label></div>
    </div>
  </div>
  <div class="card" style="margin-bottom:20px">
    <div class="card-header"><span><i class="fas fa-lock"></i> Compte utilisateur</span></div>
    <div class="card-body">
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">Login *</label><input type="text" name="login" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Mot de passe *</label><input type="password" name="mot_de_passe" class="form-control" required></div>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:12px">
    <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Enregistrer</button>
    <a href="{{ url_for('admin_medecins') }}" class="btn btn-ghost">Annuler</a>
  </div>
</form></div>{% endblock %}
