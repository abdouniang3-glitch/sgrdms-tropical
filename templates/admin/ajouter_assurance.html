{% extends "base.html" %}{% block title %}Ajouter Assurance{% endblock %}{% block page_icon %}<i class="fas fa-shield-halved"></i>{% endblock %}{% block page_title %}Nouveau Contrat d'Assurance{% endblock %}
{% block content %}<div style="max-width:680px"><form method="POST" class="fade-in">
  <div class="card" style="margin-bottom:20px"><div class="card-header"><span><i class="fas fa-file-contract"></i> Détails du contrat</span></div>
  <div class="card-body">
    <div class="form-row form-row-2">
      <div class="form-group"><label class="form-label">Compagnie *</label><input type="text" name="nom_compagnie" class="form-control" required></div>
      <div class="form-group"><label class="form-label">N° Contrat *</label><input type="text" name="numero_contrat" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Taux prise en charge (%)</label><input type="number" name="taux" class="form-control" min="0" max="100" step="0.01" value="80"></div>
      <div class="form-group"><label class="form-label">Type</label><select name="type_assurance" class="form-select"><option>maladie</option><option>accident</option><option>maternité</option></select></div>
      <div class="form-group"><label class="form-label">Statut</label><select name="statut" class="form-select"><option value="active">Active</option><option value="expirée">Expirée</option><option value="suspendue">Suspendue</option></select></div>
      <div class="form-group"><label class="form-label">Plafond annuel (FCFA)</label><input type="number" name="plafond" class="form-control" value="0"></div>
      <div class="form-group"><label class="form-label">Début couverture</label><input type="date" name="date_debut" class="form-control"></div>
      <div class="form-group"><label class="form-label">Fin couverture</label><input type="date" name="fin_couverture" class="form-control"></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">Type prise en charge</label><input type="text" name="type_prise_charge" class="form-control" placeholder="ex: Soins courants, Hospitalisation"></div>
    </div>
    <div class="form-check"><input type="checkbox" name="tiers_pay" id="tp"><label for="tp">Tiers payant actif</label></div>
  </div></div>
  <div style="display:flex;gap:12px"><button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Enregistrer</button><a href="{{ url_for('admin_assurances') }}" class="btn btn-ghost">Annuler</a></div>
</form></div>{% endblock %}
