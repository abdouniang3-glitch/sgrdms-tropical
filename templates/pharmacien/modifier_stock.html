{% extends "base.html" %}{% block title %}Modifier Stock{% endblock %}
{% block page_icon %}<i class="fas fa-warehouse" style="color:var(--gold)"></i>{% endblock %}
{% block page_title %}Modifier Stock — {{ inv.nom_medicament }}{% endblock %}
{% block content %}<div style="max-width:520px"><form method="POST" class="fade-in">
  <div class="card" style="margin-bottom:20px"><div class="card-header"><span><i class="fas fa-pen"></i> Mise à jour inventaire</span></div>
  <div class="card-body">
    <div class="form-row form-row-2">
      <div class="form-group"><label class="form-label">Quantité disponible *</label><input type="number" name="quantite" class="form-control" value="{{ inv.quantite_dispo }}" required min="0"></div>
      <div class="form-group"><label class="form-label">Seuil d'alerte *</label><input type="number" name="seuil" class="form-control" value="{{ inv.seuil_alerte }}" required min="0"></div>
      <div class="form-group"><label class="form-label">N° de lot</label><input type="text" name="numero_lot" class="form-control" value="{{ inv.numero_lot or '' }}"></div>
      <div class="form-group"><label class="form-label">Date d'expiration</label><input type="date" name="date_expiration" class="form-control" value="{{ inv.date_expiration or '' }}"></div>
    </div>
  </div></div>
  <div style="display:flex;gap:12px"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Mettre à jour</button><a href="{{ url_for('pharmacien_medicaments') }}" class="btn btn-ghost">Annuler</a></div>
</form></div>{% endblock %}
