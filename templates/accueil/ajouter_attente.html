{% extends "base.html" %}{% block title %}Ajouter à la liste d'attente{% endblock %}
{% block page_icon %}<i class="fas fa-clock" style="color:var(--cyan)"></i>{% endblock %}
{% block page_title %}Ajouter à la Liste d'Attente{% endblock %}
{% block content %}<div style="max-width:540px"><form method="POST" class="fade-in">
  <div class="card" style="margin-bottom:20px"><div class="card-header"><span><i class="fas fa-clock"></i> Inscription liste d'attente</span></div>
  <div class="card-body">
    <div class="form-row form-row-2">
      <div class="form-group"><label class="form-label">Patient *</label>
        <select name="id_patient" class="form-select" required>
          {% for p in patients %}<option value="{{ p.id_patient }}">{{ p.nom_patient }} {{ p.prenom_patient }}</option>{% endfor %}
        </select></div>
      <div class="form-group"><label class="form-label">Centre *</label>
        <select name="id_centre" class="form-select" required>
          {% for c in centres %}<option value="{{ c.id_centre }}">{{ c.nom_centre }}</option>{% endfor %}
        </select></div>
      <div class="form-group"><label class="form-label">Priorité</label>
        <select name="priorite" class="form-select">
          <option value="normale">Normale</option>
          <option value="haute">Haute</option>
          <option value="urgente">Urgente</option>
        </select></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">Motif</label>
        <textarea name="motif" class="form-control" rows="2"></textarea></div>
    </div>
  </div></div>
  <div style="display:flex;gap:12px">
    <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Inscrire</button>
    <a href="{{ url_for('accueil_liste_attente') }}" class="btn btn-ghost">Annuler</a>
  </div>
</form></div>{% endblock %}
