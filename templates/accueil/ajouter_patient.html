{% extends "base.html" %}{% block title %}Enregistrer Patient{% endblock %}
{% block page_icon %}<i class="fas fa-user-plus" style="color:var(--cyan)"></i>{% endblock %}
{% block page_title %}Enregistrer un Nouveau Patient{% endblock %}
{% block content %}<div style="max-width:760px"><form method="POST" class="fade-in">
  <div class="card" style="margin-bottom:16px"><div class="card-header"><span><i class="fas fa-id-card"></i> Informations personnelles</span></div>
  <div class="card-body">
    <div class="form-row form-row-2">
      <div class="form-group"><label class="form-label">Nom *</label><input type="text" name="nom" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Prénom *</label><input type="text" name="prenom" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Date de naissance</label><input type="date" name="date_naissance" class="form-control"></div>
      <div class="form-group"><label class="form-label">Sexe</label>
        <select name="sexe" class="form-select"><option value="M">Masculin</option><option value="F">Féminin</option><option value="A">Autre</option></select></div>
      <div class="form-group"><label class="form-label">Téléphone</label><input type="text" name="telephone" class="form-control" placeholder="+221 77 000 00 00"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" name="mail" class="form-control"></div>
    </div>
    <div class="form-group"><label class="form-label">Adresse</label><input type="text" name="adresse" class="form-control"></div>
  </div></div>
  <div class="card" style="margin-bottom:16px"><div class="card-header"><span><i class="fas fa-heartbeat"></i> Dossier médical initial</span></div>
  <div class="card-body">
    <div class="form-row form-row-3">
      <div class="form-group"><label class="form-label">Groupe sanguin</label>
        <select name="groupe_sanguin" class="form-select"><option value="">—</option>
          {% for g in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}<option>{{ g }}</option>{% endfor %}
        </select></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">Allergies connues</label>
        <input type="text" name="allergies" class="form-control" placeholder="ex: Pénicilline, Latex, Aspirine"></div>
    </div>
    <div class="form-group"><label class="form-label">Antécédents médicaux</label>
      <textarea name="antecedents" class="form-control" placeholder="Maladies chroniques, chirurgies..."></textarea></div>
  </div></div>
  <div class="card" style="margin-bottom:20px"><div class="card-header"><span><i class="fas fa-lock"></i> Compte portail patient</span></div>
  <div class="card-body">
    <div class="form-row form-row-2">
      <div class="form-group"><label class="form-label">Login *</label><input type="text" name="login" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Mot de passe *</label><input type="password" name="mot_de_passe" class="form-control" required></div>
    </div>
  </div></div>
  <div style="display:flex;gap:12px">
    <button type="submit" class="btn btn-success"><i class="fas fa-check"></i> Enregistrer le patient</button>
    <a href="{{ url_for('accueil_patients') }}" class="btn btn-ghost">Annuler</a>
  </div>
</form></div>{% endblock %}
